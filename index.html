<!doctype html>
<html lang="<!--lang-->" dir="<!--dir-->">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
    <meta name="author" content="Munther AlHajjar">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mh-theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <!--app-head-->
  </head>
  <body>
    <div id="root" data-route='<!--app-route-->'><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
